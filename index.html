<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزرعتي — إدارة المزرعة المتكاملة</title>
<style>
:root{
  --ink:#1f1c19; --ink2:#26231f; --panel:#2a2622; --line:#3b362f;
  --field:#332f29; --cream:#e8e1d1; --muted:#a49c8c;
  --gold:#d9a441; --leaf:#3e5138; --green:#7d9a63; --clay:#b9663f; --sky:#6f8fa6;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--cream); min-height:100vh;
  font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:15px; line-height:1.7;
}
h2,h3,h4{font-family:Amiri,"Noto Naskh Arabic",Georgia,serif; font-weight:700; margin:0}
button,input,select,textarea{font-family:inherit; font-size:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

/* ---------- الشريط العلوي ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:14px 22px; background:var(--ink2); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
.brand{display:flex; flex-direction:column}
.brand-mark{font-family:Amiri,Georgia,serif; font-size:26px; color:var(--gold); line-height:1.1}
.brand-sub{font-size:11.5px; color:var(--muted)}
.tabs{display:flex; gap:4px; flex-wrap:wrap}
.tab{background:none; border:none; color:var(--cream); padding:8px 14px; border-radius:999px; cursor:pointer; opacity:.75}
.tab:hover{opacity:1; background:#ffffff0d}
.tab.on{background:var(--gold); color:#231f1a; font-weight:700; opacity:1}

.page{max-width:1180px; margin:0 auto; padding:26px 20px 70px}
.sechead{margin:8px 0 22px}
.eyebrow{color:var(--gold); font-size:13px}
.sechead h2{font-size:34px; margin:2px 0 6px}
.sechead p{margin:0; color:var(--muted); max-width:62ch}

/* ---------- عناصر ---------- */
.kindrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.kindchip{background:var(--panel); border:1px solid var(--line); color:var(--cream); padding:9px 14px; border-radius:10px; cursor:pointer}
.kindchip:hover{border-color:#5c5548}
.kindchip.on{border-color:var(--gold); background:#d9a4411a; color:var(--gold)}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px}
.panel-head h3{font-size:20px}
.panel-tag{font-size:12px; color:var(--muted)}

.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px}
.field{display:flex; flex-direction:column; gap:6px}
.field.wide{grid-column:1/-1}
.flabel{font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center}
.unit{font-style:normal; font-size:11px; color:var(--gold); background:#d9a4411a; padding:1px 7px; border-radius:999px}
input,select{background:var(--field); border:1px solid var(--line); color:var(--cream); border-radius:9px; padding:10px 12px; width:100%}
input:hover,select:hover{border-color:#5c5548}
input[type=date]{color-scheme:dark}

.hint{margin:14px 0 0; font-size:13.5px; color:var(--muted)}
.hint b{color:var(--gold)}
.err{margin:12px 0 0; color:#e08d6c; font-size:13.5px}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.btn{border-radius:999px; padding:10px 22px; cursor:pointer; border:1px solid transparent}
.btn.gold{background:var(--gold); color:#231f1a; font-weight:700}
.btn.gold:hover{background:#e6b75c}
.btn.gold:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:none; border-color:#5c5548; color:var(--cream)}
.btn.ghost:hover{border-color:var(--cream)}
.linkbtn{background:none; border:none; color:var(--muted); cursor:pointer; text-decoration:underline; padding:0}
.linkbtn:hover{color:var(--clay)}

.empty{text-align:center; padding:26px 10px; color:var(--muted)}
.empty p{margin:0 0 14px}

.feed{list-style:none; margin:0; padding:0}
.feed li{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px dashed var(--line); font-size:14px}
.feed li:first-child{border-top:none}
.fd{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px}
.ft{flex:1}

.filters{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px}
.filters .btn{width:100%}

.statstrip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.stat .sl{display:block; font-size:12.5px; color:var(--muted)}
.stat .sv{font-size:23px; font-family:Amiri,Georgia,serif}
.stat .sv em{font-style:normal; font-size:12px; color:var(--muted)}
.stat.good{border-inline-start:3px solid var(--green)}
.stat.warn{border-inline-start:3px solid var(--gold)}
.stat.bad{border-inline-start:3px solid var(--clay)}

.tablewrap{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:14px; min-width:760px}
.tbl th{text-align:start; font-weight:600; color:var(--muted); font-size:12.5px; padding:0 10px 10px; border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px; border-bottom:1px dashed var(--line); vertical-align:top}
.tbl tfoot td{border-bottom:none; border-top:1px solid var(--gold); color:var(--gold); font-weight:700}
.mono{font-variant-numeric:tabular-nums; white-space:nowrap}
.good{color:var(--green)} .warn{color:var(--gold)} .muted{color:var(--muted)}
.pill{background:#ffffff0d; border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap}

.chartgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px}
.chartgrid .panel{margin-bottom:0}
.cardnote{margin:10px 0 0; font-size:12.5px; color:var(--muted)}
svg.chart{width:100%; height:auto; display:block}
.legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; color:var(--muted); margin-top:8px}
.legend i{width:10px; height:10px; border-radius:2px; display:inline-block; margin-inline-end:5px}

.cycleview{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; padding:18px 0}
.cnode{width:118px; height:118px; border-radius:50%; border:1px solid var(--gold); background:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.cnode b{font-size:21px; font-family:Amiri,Georgia,serif; line-height:1.1}
.cnode em{font-style:normal; font-size:11px; color:var(--gold)}
.cnode span{font-size:12px; color:var(--muted); margin-top:4px}
.arrow{color:var(--gold); font-size:20px}

.advgroup{margin-bottom:26px}
.advhead{font-size:19px; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.advhead span{font-size:12px; background:#ffffff0d; border-radius:999px; padding:2px 9px; font-family:inherit}
.advhead.good{color:var(--green)} .advhead.warn{color:var(--gold)} .advhead.bad{color:var(--clay)}
.advlist{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.advcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; border-inline-start:3px solid var(--line)}
.advcard.good{border-inline-start-color:var(--green)}
.advcard.warn{border-inline-start-color:var(--gold)}
.advcard.bad{border-inline-start-color:var(--clay)}
.advcard header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
.advcard h4{font-size:17px}
.advtag{font-size:11.5px; color:var(--muted); white-space:nowrap}
.advcard p{margin:0; font-size:14px}
.evidence{margin-top:8px; font-size:12.5px; color:var(--gold); font-variant-numeric:tabular-nums}

.panel.next{background:var(--leaf); border-color:#50654733}
.nextlist{margin:0; padding-inline-start:20px}
.nextlist li{margin-bottom:8px}
.nextlist b{color:var(--gold)}

.modal{position:fixed; inset:0; background:#000000b8; display:flex; align-items:center; justify-content:center; padding:20px; z-index:50}
.modal[hidden]{display:none}
.modalbox{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; max-width:680px; width:100%}
.modalbox h3{font-size:20px; margin-bottom:6px}
.modalbox textarea{width:100%; height:220px; margin-top:12px; background:var(--field); color:var(--cream);
  border:1px solid var(--line); border-radius:9px; padding:12px; direction:ltr; text-align:left; font-size:12.5px}

.toast{position:fixed; inset-inline-start:50%; transform:translateX(-50%); bottom:24px;
  background:var(--gold); color:#231f1a; font-weight:700; padding:10px 22px; border-radius:999px; z-index:60}
.toast[hidden]{display:none}

@media (max-width:640px){
  .sechead h2{font-size:27px}
  .page{padding:20px 14px 60px}
  .topbar{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">مزرعتي</span>
    <span class="brand-sub">نباتات · أغنام نعيمي · استدامة</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="entry">إدخال البيانات</button>
    <button class="tab" data-tab="reports">التقارير</button>
    <button class="tab" data-tab="analysis">التحليل</button>
    <button class="tab" data-tab="advice">الاقتراحات</button>
  </nav>
</header>

<main class="page" id="page"></main>

<div class="modal" id="modal" hidden>
  <div class="modalbox">
    <h3 id="modalTitle"></h3>
    <p class="muted" id="modalNote"></p>
    <textarea id="modalText"></textarea>
    <div class="actions">
      <button class="btn gold" data-act="modal-close">إغلاق</button>
      <button class="btn ghost" data-act="modal-import" id="importBtn" hidden>استيراد البيانات</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   مزرعتي — تطبيق إدارة المزرعة المتكاملة
   HTML + JavaScript فقط، بدون أي مكتبات خارجية.
   ============================================================ */

var STORE_KEY = "mazraati_records_v1";
var SAR = "ر.س";

var ZONES_PLANT = ["بيت زجاجي 1", "بيت زجاجي 2", "بيت زجاجي 3", "المشتل الخارجي"];
var ZONES_ALL = ZONES_PLANT.concat(["المراعي", "حظائر الأغنام", "منطقة التسميد", "بركة التجميع"]);

var OPS = {
  "تجهيز": { unit: "كجم سماد", hint: "تحضير التربة والأسمدة العضوية المناسبة لكل محصول." },
  "ريّ":   { unit: "م³ مياه",  hint: "ريّ منتظم حسب احتياج كل نوع نبات." },
  "صيانة": { unit: "ساعة عمل", hint: "إزالة الأعشاب والآفات دون مبيدات ضارة." },
  "حصاد":  { unit: "نبتة",     hint: "جمع الشتلات والنباتات الجاهزة للبيع." }
};
var FLOCK = {
  "تغذية": { unit: "كجم علف",   hint: "علف عالي الجودة ومياه نظيفة يومياً." },
  "صحة":   { unit: "رأس معالج", hint: "فحوصات دورية وتطعيمات للوقاية." },
  "تكاثر": { unit: "مولود",     hint: "برنامج تحسين وراثي منظم." },
  "رعاية": { unit: "ساعة عمل",  hint: "مأوى آمن ونظافة الحظائر." }
};
var RESOURCES = {
  "روث مجمّع": { unit: "كجم" },
  "سماد عضوي منتج": { unit: "كجم" },
  "غاز حيوي": { unit: "م³" },
  "مياه معاد تدويرها": { unit: "م³" }
};
var PRODUCTS = ["شتلات", "نباتات زينة", "لحوم", "ألبان", "سماد عضوي"];
var CHANNELS = ["مشاتل التجزئة", "أفراد من المزرعة", "السوق المحلي", "موزّع بشراكة"];
var EXP_CATS = ["أعلاف", "بذور وشتلات", "رعاية بيطرية", "طاقة", "مياه", "صيانة", "عمالة", "تسويق", "أخرى"];
var SECTIONS = ["قسم النباتات", "قسم الأغنام", "مشترك"];

var KINDS = {
  plants: { label:"إنتاج المشاتل", icon:"🌱", section:"قسم النباتات", fields:[
    {n:"date", l:"التاريخ", t:"date"},
    {n:"zone", l:"الموقع", t:"select", o:ZONES_PLANT},
    {n:"item", l:"الصنف", t:"select", o:["شتلات موسمية","شتلات دائمة","نباتات زينة داخلية","نباتات زينة خارجية"]},
    {n:"qty", l:"الكمية", t:"number", u:"شتلة"},
    {n:"cost", l:"التكلفة", t:"number", u:SAR},
    {n:"note", l:"ملاحظة", t:"text", wide:true}
  ]},
  ops: { label:"عملية زراعية", icon:"🚿", section:"قسم النباتات", drive:"opType", fields:[
    {n:"date", l:"التاريخ", t:"date"},
    {n:"opType", l:"نوع العملية", t:"select", o:Object.keys(OPS)},
    {n:"zone", l:"الموقع", t:"select", o:ZONES_ALL},
    {n:"qty", l:"المقدار", t:"number", dyn:function(r){ return (OPS[r.opType]||{}).unit || "وحدة"; }},
    {n:"cost", l:"التكلفة", t:"number", u:SAR},
    {n:"note", l:"ملاحظة", t:"text", wide:true}
  ]},
  flock: { label:"سجل الأغنام", icon:"🐑", section:"قسم الأغنام", drive:"category", fields:[
    {n:"date", l:"التاريخ", t:"date"},
    {n:"category", l:"نوع السجل", t:"select", o:Object.keys(FLOCK)},
    {n:"head", l:"عدد الرؤوس", t:"number", u:"رأس"},
    {n:"qty", l:"المقدار", t:"number", dyn:function(r){ return (FLOCK[r.category]||{}).unit || "وحدة"; }},
    {n:"cost", l:"التكلفة", t:"number", u:SAR},
    {n:"note", l:"ملاحظة", t:"text", wide:true}
  ]},
  sales: { label:"مبيعات", icon:"📈", section:"مشترك", fields:[
    {n:"date", l:"التاريخ", t:"date"},
    {n:"product", l:"المنتج", t:"select", o:PRODUCTS},
    {n:"channel", l:"قناة البيع", t:"select", o:CHANNELS},
    {n:"qty", l:"الكمية", t:"number", u:"وحدة"},
    {n:"price", l:"سعر الوحدة", t:"number", u:SAR},
    {n:"note", l:"ملاحظة", t:"text", wide:true}
  ]},
  cycle: { label:"دورة الموارد", icon:"♻️", section:"الاستدامة", drive:"resource", fields:[
    {n:"date", l:"التاريخ", t:"date"},
    {n:"resource", l:"المورد", t:"select", o:Object.keys(RESOURCES)},
    {n:"qty", l:"المقدار", t:"number", dyn:function(r){ return (RESOURCES[r.resource]||{}).unit || "وحدة"; }},
    {n:"note", l:"ملاحظة", t:"text", wide:true}
  ]},
  expense: { label:"مصروف", icon:"🧾", section:"مشترك", fields:[
    {n:"date", l:"التاريخ", t:"date"},
    {n:"category", l:"بند المصروف", t:"select", o:EXP_CATS},
    {n:"section", l:"القسم", t:"select", o:SECTIONS},
    {n:"cost", l:"المبلغ", t:"number", u:SAR},
    {n:"note", l:"ملاحظة", t:"text", wide:true}
  ]}
};

/* ---------- أدوات ---------- */
var NF = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });
function num(v){ v = parseFloat(v); return isFinite(v) ? v : 0; }
function fmt(v){ return NF.format(num(v)); }
function money(v){ return NF.format(Math.round(num(v))); }
function today(){ return new Date().toISOString().slice(0,10); }
function monthOf(d){ return (d||"").slice(0,7); }
function daysSince(d){ return (Date.now() - new Date(d).getTime()) / 86400000; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function revenueOf(r){ return r.kind === "sales" ? num(r.qty) * num(r.price) : 0; }
function costOf(r){ return r.kind === "sales" ? 0 : num(r.cost); }
function unitOf(rec, f){ return f.dyn ? f.dyn(rec) : (f.u || ""); }

/* ---------- الحالة والتخزين ---------- */
var state = {
  tab: "entry",
  records: [],
  kind: "plants",
  filters: { kind:"all", from:"", to:"", q:"" }
};

function save(){
  if (!window.storage) return;
  try { window.storage.set(STORE_KEY, JSON.stringify(state.records)); } catch(e){}
}
function load(cb){
  if (!window.storage) { cb(); return; }
  try {
    window.storage.get(STORE_KEY).then(function(res){
      if (res && res.value) { try { state.records = JSON.parse(res.value) || []; } catch(e){} }
      cb();
    })["catch"](function(){ cb(); });
  } catch(e){ cb(); }
}

function addRecord(rec){ state.records.unshift(rec); save(); }
function delRecord(id){
  state.records = state.records.filter(function(r){ return r.id !== id; });
  save(); render(); toast("تم حذف السجل");
}

var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 2600);
}

/* ---------- وصف السجل ---------- */
function describe(r){
  function u(name){
    var fd = null, fs = KINDS[r.kind].fields, i;
    for (i=0;i<fs.length;i++) if (fs[i].n === name) fd = fs[i];
    return fd ? unitOf(r, fd) : "";
  }
  switch(r.kind){
    case "plants":  return r.item + " — " + fmt(r.qty) + " شتلة في " + r.zone;
    case "ops":     return r.opType + " — " + fmt(r.qty) + " " + u("qty") + " في " + r.zone;
    case "flock":   return r.category + " — " + fmt(r.qty) + " " + u("qty") + " لـ " + fmt(r.head) + " رأس";
    case "sales":   return "بيع " + r.product + " — " + fmt(r.qty) + " وحدة عبر " + r.channel + " بقيمة " + money(revenueOf(r)) + " " + SAR;
    case "cycle":   return r.resource + " — " + fmt(r.qty) + " " + u("qty");
    case "expense": return r.category + " (" + r.section + ") — " + money(r.cost) + " " + SAR;
  }
  return "";
}

/* ============================================================
   محرّك التحليل
   ============================================================ */
function analyze(recs){
  var rev = 0, cost = 0, months = {}, i;
  for (i=0;i<recs.length;i++){ rev += revenueOf(recs[i]); cost += costOf(recs[i]); }

  recs.forEach(function(r){
    var m = monthOf(r.date); if (!m) return;
    if (!months[m]) months[m] = { m:m, rev:0, cost:0, water:0, recycled:0 };
    months[m].rev += revenueOf(r);
    months[m].cost += costOf(r);
    if (r.kind === "ops" && r.opType === "ريّ") months[m].water += num(r.qty);
    if (r.kind === "cycle" && r.resource === "مياه معاد تدويرها") months[m].recycled += num(r.qty);
  });
  var monthly = Object.keys(months).sort().slice(-12).map(function(k){
    var x = months[k];
    return { m:x.m.slice(5) + "/" + x.m.slice(2,4), rev:Math.round(x.rev), cost:Math.round(x.cost), water:Math.round(x.water), recycled:Math.round(x.recycled) };
  });

  var zoneMap = {};
  recs.filter(function(r){ return r.kind === "plants"; }).forEach(function(r){
    zoneMap[r.zone] = (zoneMap[r.zone]||0) + num(r.qty);
  });
  var byZone = Object.keys(zoneMap).map(function(k){ return { name:k, value:zoneMap[k] }; })
    .sort(function(a,b){ return b.value - a.value; });

  var chMap = {};
  recs.filter(function(r){ return r.kind === "sales"; }).forEach(function(r){
    chMap[r.channel] = (chMap[r.channel]||0) + revenueOf(r);
  });
  var byChannel = Object.keys(chMap).map(function(k){ return { name:k, value:Math.round(chMap[k]) }; })
    .sort(function(a,b){ return b.value - a.value; });

  var secMap = { "قسم النباتات":0, "قسم الأغنام":0, "مشترك":0 };
  recs.forEach(function(r){
    var c = costOf(r); if (!c) return;
    var sec = r.kind === "expense" ? (r.section || "مشترك") : KINDS[r.kind].section;
    if (sec === "الاستدامة") sec = "مشترك";
    secMap[sec] = (secMap[sec]||0) + c;
  });
  var bySection = Object.keys(secMap).map(function(k){ return { name:k, value:Math.round(secMap[k]) }; });

  function sumCycle(res){
    return recs.filter(function(r){ return r.kind === "cycle" && r.resource === res; })
               .reduce(function(s,r){ return s + num(r.qty); }, 0);
  }
  function sumOps(t){
    return recs.filter(function(r){ return r.kind === "ops" && r.opType === t; })
               .reduce(function(s,r){ return s + num(r.qty); }, 0);
  }
  var manure = sumCycle("روث مجمّع"), compost = sumCycle("سماد عضوي منتج");
  var biogas = sumCycle("غاز حيوي"), recycledWater = sumCycle("مياه معاد تدويرها");
  var water = sumOps("ريّ"), fertUsed = sumOps("تجهيز"), harvested = sumOps("حصاد");
  var plantsQty = recs.filter(function(r){ return r.kind === "plants"; }).reduce(function(s,r){ return s + num(r.qty); }, 0);
  var soldPlants = recs.filter(function(r){ return r.kind === "sales" && (r.product === "شتلات" || r.product === "نباتات زينة"); })
                       .reduce(function(s,r){ return s + num(r.qty); }, 0);

  return {
    rev:rev, cost:cost, net:rev-cost, monthly:monthly, byZone:byZone, byChannel:byChannel, bySection:bySection,
    manure:manure, compost:compost, biogas:biogas, recycledWater:recycledWater,
    water:water, fertUsed:fertUsed, harvested:harvested, plantsQty:plantsQty, soldPlants:soldPlants,
    recycleRate: water ? (recycledWater/water)*100 : 0,
    convRate: manure ? (compost/manure)*100 : 0,
    compostCover: fertUsed ? Math.min(999,(compost/fertUsed)*100) : 0
  };
}

/* ============================================================
   رسوم SVG مكتوبة يدوياً (بدون مكتبات)
   ============================================================ */
var W = 480, H = 250, PL = 12, PR = 52, PT = 14, PB = 30;
function niceMax(v){
  if (!(v>0)) return 10;
  var p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p;
  var m = n<=1?1:n<=2?2:n<=5?5:10;
  return m*p;
}
function svgOpen(){ return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">'; }
function gridY(max){
  var out = "", i, y, v;
  for (i=0;i<=4;i++){
    y = PT + (H-PT-PB) * (i/4);
    v = max - max*(i/4);
    out += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#3a3630" stroke-dasharray="3 3"/>';
    out += '<text x="'+(W-PR+6)+'" y="'+(y+4)+'" fill="#a49c8c" font-size="10">'+NF.format(Math.round(v))+'</text>';
  }
  return out;
}
/* أعمدة مجمّعة — الأحدث إلى اليسار (اتجاه القراءة العربي) */
function groupedBars(data, series){
  if (!data.length) return emptyChart();
  var d = data.slice().reverse(), max = 0;
  d.forEach(function(row){ series.forEach(function(s){ max = Math.max(max, num(row[s.key])); }); });
  max = niceMax(max);
  var plotW = W-PL-PR, plotH = H-PT-PB, step = plotW/d.length;
  var bw = Math.min(20, (step-10)/series.length);
  var out = svgOpen() + gridY(max);
  d.forEach(function(row, i){
    var cx = PL + step*i + step/2;
    series.forEach(function(s, j){
      var v = num(row[s.key]);
      var h = (v/max)*plotH;
      var x = cx - (series.length*bw)/2 + j*bw;
      out += '<rect x="'+x.toFixed(1)+'" y="'+(PT+plotH-h).toFixed(1)+'" width="'+(bw-2)+'" height="'+Math.max(0,h).toFixed(1)+'" fill="'+s.color+'" rx="2">'
           + '<title>'+esc(row.m+" · "+s.label+" "+NF.format(v))+'</title></rect>';
    });
    out += '<text x="'+cx+'" y="'+(H-10)+'" fill="#a49c8c" font-size="10" text-anchor="middle">'+esc(row.m)+'</text>';
  });
  return out + '</svg>' + legend(series);
}
function lines(data, series){
  if (!data.length) return emptyChart();
  var d = data.slice().reverse(), max = 0;
  d.forEach(function(row){ series.forEach(function(s){ max = Math.max(max, num(row[s.key])); }); });
  max = niceMax(max);
  var plotW = W-PL-PR, plotH = H-PT-PB, step = d.length>1 ? plotW/(d.length-1) : 0;
  var out = svgOpen() + gridY(max);
  series.forEach(function(s){
    var pts = d.map(function(row,i){
      var x = PL + (d.length>1 ? step*i : plotW/2);
      var y = PT + plotH - (num(row[s.key])/max)*plotH;
      return x.toFixed(1)+","+y.toFixed(1);
    });
    out += '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"/>';
    d.forEach(function(row,i){
      var x = PL + (d.length>1 ? step*i : plotW/2);
      var y = PT + plotH - (num(row[s.key])/max)*plotH;
      out += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="'+s.color+'">'
           + '<title>'+esc(row.m+" · "+s.label+" "+NF.format(num(row[s.key])))+'</title></circle>';
    });
  });
  d.forEach(function(row,i){
    var x = PL + (d.length>1 ? step*i : plotW/2);
    out += '<text x="'+x+'" y="'+(H-10)+'" fill="#a49c8c" font-size="10" text-anchor="middle">'+esc(row.m)+'</text>';
  });
  return out + '</svg>' + legend(series);
}
/* أعمدة أفقية تمتد من اليمين إلى اليسار */
function hBars(data, color, unit){
  if (!data.length) return emptyChart();
  var max = niceMax(Math.max.apply(null, data.map(function(x){ return x.value; })));
  var labelW = 108, rowH = Math.min(34, (H-PT-10)/data.length);
  var barMax = W - labelW - 20;
  var out = svgOpen();
  data.forEach(function(row,i){
    var y = PT + i*rowH;
    var w = (row.value/max)*barMax;
    out += '<text x="'+(W-6)+'" y="'+(y+rowH/2+4)+'" fill="#e8e1d1" font-size="11" text-anchor="end">'+esc(row.name)+'</text>';
    out += '<rect x="'+(W-labelW-w).toFixed(1)+'" y="'+(y+4)+'" width="'+Math.max(0,w).toFixed(1)+'" height="'+(rowH-12)+'" fill="'+color+'" rx="2">'
         + '<title>'+esc(row.name+" · "+NF.format(row.value)+" "+unit)+'</title></rect>';
    out += '<text x="'+(W-labelW-w-6).toFixed(1)+'" y="'+(y+rowH/2+4)+'" fill="#a49c8c" font-size="10" text-anchor="end">'+NF.format(row.value)+'</text>';
  });
  return out + '</svg>';
}
function donut(data, colors){
  var total = data.reduce(function(s,x){ return s + x.value; }, 0);
  if (!total) return emptyChart();
  var cx = W/2, cy = H/2, r = 88, ri = 50, a0 = -Math.PI/2, out = svgOpen();
  data.forEach(function(row,i){
    var a1 = a0 + (row.value/total) * Math.PI * 2;
    var large = (a1-a0) > Math.PI ? 1 : 0;
    var p = [
      "M", (cx+r*Math.cos(a0)).toFixed(2), (cy+r*Math.sin(a0)).toFixed(2),
      "A", r, r, 0, large, 1, (cx+r*Math.cos(a1)).toFixed(2), (cy+r*Math.sin(a1)).toFixed(2),
      "L", (cx+ri*Math.cos(a1)).toFixed(2), (cy+ri*Math.sin(a1)).toFixed(2),
      "A", ri, ri, 0, large, 0, (cx+ri*Math.cos(a0)).toFixed(2), (cy+ri*Math.sin(a0)).toFixed(2), "Z"
    ].join(" ");
    out += '<path d="'+p+'" fill="'+colors[i%colors.length]+'" stroke="#2a2622" stroke-width="1">'
         + '<title>'+esc(row.name+" · "+money(row.value)+" "+SAR+" ("+NF.format(row.value/total*100)+"%)")+'</title></path>';
    a0 = a1;
  });
  out += '<text x="'+cx+'" y="'+(cy+5)+'" fill="#e8e1d1" font-size="15" text-anchor="middle">'+money(total)+'</text>';
  return out + '</svg>' + legend(data.map(function(row,i){
    return { label: row.name + " " + NF.format(row.value/total*100) + "%", color: colors[i%colors.length] };
  }));
}
function legend(series){
  return '<div class="legend">' + series.map(function(s){
    return '<span><i style="background:'+s.color+'"></i>'+esc(s.label)+'</span>';
  }).join("") + '</div>';
}
function emptyChart(){ return '<div class="empty"><p>لا توجد بيانات كافية لهذا الرسم.</p></div>'; }

function sechead(eyebrow, title, lead){

function readForm(){
  var rec = { kind: state.kind };
  var nodes = document.querySelectorAll("#form [data-name]");
  for (var i=0;i<nodes.length;i++) rec[nodes[i].getAttribute("data-name")] = nodes[i].value;
  rec.id = uid();
  return rec;
}
function refreshDynamic(){
  var k = KINDS[state.kind], cur = readForm();
  k.fields.forEach(function(f){
    if (!f.dyn) return;
    var el = document.querySelector('[data-unit="'+f.n+'"]');
    if (el) el.textContent = unitOf(cur, f);
  });
  var hint = document.getElementById("formHint");
  if (!hint) return;
  if (state.kind === "ops" && OPS[cur.opType]) hint.textContent = OPS[cur.opType].hint;
  else if (state.kind === "flock" && FLOCK[cur.category]) hint.textContent = FLOCK[cur.category].hint;
  else if (state.kind === "sales") hint.innerHTML = "قيمة هذه المبيعة: <b>" + money(num(cur.qty)*num(cur.price)) + " " + SAR + "</b>";
  else hint.textContent = "";
}
function submitForm(){
  var rec = readForm(), err = document.getElementById("formErr"), msg = "";
  var hasQty = KINDS[state.kind].fields.some(function(f){ return f.n === "qty"; });
  if (!rec.date) msg = "أدخل التاريخ قبل الحفظ.";
  else if (hasQty && num(rec.qty) <= 0) msg = "أدخل مقداراً أكبر من صفر.";
  else if (state.kind === "expense" && num(rec.cost) <= 0) msg = "أدخل مبلغ المصروف.";
  else if (state.kind === "sales" && num(rec.price) <= 0) msg = "أدخل سعر الوحدة.";
  if (msg){ err.textContent = msg; err.hidden = false; return; }
  err.hidden = true;
  addRecord(rec);
  render();
  toast("تم حفظ السجل");
}

    if (f.kind !== "all" && r.kind !== f.kind) return false;
    if (f.from && r.date < f.from) return false;
    if (f.to && r.date > f.to) return false;
    if (f.q && describe(r).indexOf(f.q) < 0 && (r.note||"").indexOf(f.q) < 0) return false;
    return true;
  }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });

function exportCsv(){
  var rows = filteredRows();

function download(name, text, mime){
  try {
    var blob = new Blob([text], { type: mime });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){}
}

}
function card(title, body, note){
  return '<section class="panel"><div class="panel-head"><h3>'+title+'</h3></div>'
       + body + (note ? '<p class="cardnote">'+note+'</p>' : '') + '</section>';
}
function cnode(label, value, unit){
  return '<div class="cnode"><b>'+fmt(value)+'</b><em>'+unit+'</em><span>'+label+'</span></div>';
}

/* ---------- 4) الاقتراحات ---------- */
function suggest(recs, a){
  var out = [];
  function add(type, area, title, body, evidence){ out.push({type:type, area:area, title:title, body:body, evidence:evidence}); }

  /* المالية */
  if (a.net < 0){
    var worst = a.bySection.slice().sort(function(x,y){ return y.value-x.value; })[0];
    add("alert","المردود","التكاليف تتجاوز الإيرادات",
      "راجع بنود الصرف الأعلى وقارنها بإيراد كل قسم قبل التوسّع في الإنتاج.",
      "الصافي "+money(a.net)+" "+SAR+" · أعلى قسم صرفاً: "+(worst?worst.name:"—"));
  } else if (a.rev > 0){
    add("ok","المردود","الإيرادات تغطي التكاليف",
      "استمر في المسار الحالي، ووجّه الفائض إلى تحسين البيوت الزجاجية والحظائر.",
      "الصافي "+money(a.net)+" "+SAR+" بهامش "+fmt(a.net/a.rev*100)+"%");
  }

  var expBy = {}, expTotal = 0;
  recs.filter(function(r){ return r.kind === "expense"; }).forEach(function(r){
    expBy[r.category] = (expBy[r.category]||0) + num(r.cost); expTotal += num(r.cost);
  });
  var topExp = Object.keys(expBy).map(function(k){ return [k, expBy[k]]; })
    .sort(function(x,y){ return y[1]-x[1]; })[0];
  if (topExp && expTotal && topExp[1]/expTotal > 0.4){
    add("opp","المردود","بند «"+topExp[0]+"» يستحوذ على معظم المصروفات",
      "بند واحد بهذا الحجم يعني أن أي تحسين فيه ينعكس مباشرة على الربح. اطلب عروض أسعار بديلة أو ابحث عن تغطية داخلية من موارد المزرعة.",
      money(topExp[1])+" "+SAR+" من أصل "+money(expTotal)+" "+SAR+" ("+fmt(topExp[1]/expTotal*100)+"%)");
  }

  /* التسويق */
  var totalCh = a.byChannel.reduce(function(s,c){ return s + c.value; }, 0);
  if (a.byChannel.length && totalCh){
    var top = a.byChannel[0];
    if (top.value/totalCh > 0.7){
      add("opp","التسويق","المبيعات معتمدة على قناة واحدة",
        "الاعتماد على قناة واحدة يجعل الإيراد هشاً. ابنِ شراكات طويلة الأجل مع موزّعين، ووسّع البيع المباشر من المزرعة.",
        top.name+" تشكّل "+fmt(top.value/totalCh*100)+"% من الإيراد");
    } else {
      add("ok","التسويق","قنوات البيع متنوعة",
        "التوزيع الحالي يحمي الإيراد من تقلّب قناة واحدة. ثبّت العلاقات مع أفضل قناتين بعقود موسمية.",
        a.byChannel.length+" قنوات نشطة");
    }
  }
  if (!recs.some(function(r){ return r.kind === "sales" && r.channel === "موزّع بشراكة"; })){
    add("opp","التسويق","لا توجد مبيعات عبر شراكات ثابتة",
      "الشراكات طويلة الأجل مع الموزّعين تضمن تصريف الإنتاج قبل موسم الحصاد وتقلّل الفاقد.", null);
  }

  /* المياه والعمليات */
  var mo = a.monthly;
  if (mo.length >= 2){
    var last = mo[mo.length-1], prev = mo[mo.length-2];
    if (prev.water > 0 && last.water > prev.water*1.2){
      add("alert","تحسين بيئة","استهلاك مياه الريّ يرتفع",
        "ارتفاع بهذا القدر خلال شهر واحد يشير غالباً إلى تسريب أو ريّ زائد. افحص شبكة الريّ وراجع جدول كل بيت زجاجي حسب نوع النبات.",
        fmt(last.water)+" م³ هذا الشهر مقابل "+fmt(prev.water)+" م³ في السابق");
    }
  }
  if (a.water > 0 && a.recycleRate < 20){
    add("opp","الاستدامة","نسبة المياه المعاد تدويرها منخفضة",
      "بركة التجميع قادرة على تغطية جزء أكبر من الريّ. وجّه مياه الغسيل والتكثيف في البيوت الزجاجية إليها قبل السحب من المصدر الرئيسي.",
      "التدوير يغطي "+fmt(a.recycleRate)+"% من مياه الريّ");
  } else if (a.water > 0){
    add("ok","الاستدامة","تدوير المياه يعمل بكفاءة",
      "حافظ على صيانة بركة التجميع وسجّل كل دفعة معاد تدويرها للحفاظ على دقة المؤشر.",
      fmt(a.recycleRate)+"% من مياه الريّ معاد تدويرها");
  }

  var lastIrrig = {};
  recs.filter(function(r){ return r.kind === "ops" && r.opType === "ريّ"; }).forEach(function(r){
    var d = daysSince(r.date);
    if (lastIrrig[r.zone] === undefined || lastIrrig[r.zone] > d) lastIrrig[r.zone] = d;
  });
  var active = {};
  recs.filter(function(r){ return r.kind === "plants" && daysSince(r.date) < 120; }).forEach(function(r){ active[r.zone] = true; });
  var dry = Object.keys(active).filter(function(z){ return lastIrrig[z] === undefined || lastIrrig[z] > 10; });
  if (dry.length){
    add("alert","العمليات","مواقع منتِجة بلا سجل ريّ حديث",
      "إما أن الريّ يحدث دون تسجيل، أو أن هذه المواقع فعلاً متأخرة. راجعها اليوم وسجّل كل دورة ريّ لتبقى المؤشرات صحيحة.",
      dry.join("، "));
  }

  /* الأغنام */
  var health = recs.filter(function(r){ return r.kind === "flock" && r.category === "صحة"; })
                   .map(function(r){ return daysSince(r.date); }).sort(function(x,y){ return x-y; })[0];
  if (health === undefined){
    add("alert","قسم الأغنام","لا توجد سجلات صحة أو تطعيم",
      "الفحوصات الدورية والتطعيمات هي أرخص وقاية في القطيع. حدّد موعداً بيطرياً وسجّله ليبدأ التتبع.", null);
  } else if (health > 90){
    add("alert","قسم الأغنام","مضى وقت طويل على آخر فحص بيطري",
      "الفجوة الطويلة بين الفحوصات ترفع خطر انتشار المرض داخل الحظائر. رتّب زيارة بيطرية قريبة.",
      "آخر سجل صحة قبل "+fmt(health)+" يوماً");
  } else {
    add("ok","قسم الأغنام","المتابعة البيطرية منتظمة",
      "استمر على هذا الإيقاع واربط كل فحص بعدد الرؤوس المعالجة لرصد أي تكرار غير طبيعي.",
      "آخر سجل صحة قبل "+fmt(health)+" يوماً");
  }

  var feed = recs.filter(function(r){ return r.kind === "flock" && r.category === "تغذية"; });
  var heads = feed.length ? num(feed[0].head) : 0;
  if (feed.length >= 4 && heads > 0){
    var perHead = feed.reduce(function(s,r){ return s + num(r.qty); }, 0) / feed.length / heads;
    if (perHead > 3.5){
      add("opp","قسم الأغنام","استهلاك العلف لكل رأس مرتفع",
        "راجع خلط العلف ونسبة الرعي الطبيعي في المراعي؛ زيادة ساعات الرعي تخفض فاتورة الأعلاف دون التأثير على الجودة.",
        fmt(perHead)+" كجم لكل رأس في السجل الواحد");
    }
  }

  /* دورة الموارد */
  if (a.manure > 0 && a.convRate < 30){
    add("opp","الاستدامة","جزء كبير من الروث لا يتحول إلى سماد",
      "وسّع منطقة التسميد وقلّب الأكوام بانتظام؛ كل كيلو يتحول إلى سماد هو كيلو أقل يُشترى من الخارج.",
      "معدل التحويل "+fmt(a.convRate)+"% من "+fmt(a.manure)+" كجم روث");
  }
  if (a.manure > 0 && a.biogas === 0){
    add("opp","الاستدامة","وحدة الغاز الحيوي غير مستغلة",
      "يوجد روث مسجَّل دون أي إنتاج غاز حيوي. تشغيل الوحدة يغطي جزءاً من فاتورة الطاقة من مخلفات موجودة أصلاً.",
      fmt(a.manure)+" كجم روث مجمّع بلا إنتاج غاز");
  }
  if (a.compostCover >= 100){
    add("ok","الاستدامة","السماد الداخلي يغطي احتياج التسميد",
      "المنظومة تغلق دورتها كما هو مخطط لها: مخلفات القطيع تغذّي النباتات بالكامل.",
      "تغطية "+fmt(a.compostCover)+"% من التسميد المسجَّل");
  }

  /* المخزون والإدارة */
  if (a.plantsQty > 0 && a.soldPlants/a.plantsQty < 0.5){
    add("opp","المردود","الإنتاج يفوق المبيعات",
      "الشتلات الجاهزة تتراكم وتستهلك مياهاً وعمالة. قدّم عرضاً لمشاتل التجزئة أو ابدأ البيع المباشر للأفراد قبل تجاوز عمر الشتلة.",
      "بيع "+fmt(a.soldPlants)+" من أصل "+fmt(a.plantsQty)+" شتلة منتجة");
  }
  if (recs.length < 15){
    add("opp","الإدارة","السجلات ما زالت قليلة",
      "دقة التحليل ترتفع مع انتظام الإدخال. سجّل عمليات الريّ والتغذية يومياً لمدة أسبوعين وستصبح التوصيات أدق بكثير.",
      recs.length+" سجل حتى الآن");
  }
  return out;
}

function pageAdvice(){
  var a = analyze(state.records), items = suggest(state.records, a);
  var html = sechead("قراءة البيانات", "الاقتراحات",
    "قواعد تقرأ سجلاتك وتقترح الخطوة التالية — بنفس منطق المنظومة المتكاملة: لا شيء يُهدر.");

  if (!state.records.length){
    html += '<div class="panel"><div class="empty"><p>الاقتراحات تُبنى على سجلاتك. أدخل عمليات المزرعة أولاً وستظهر التوصيات هنا.</p></div></div>';
  } else {
    [{k:"alert",l:"يحتاج انتباهاً",t:"bad"},
     {k:"opp",l:"فرص للتحسين",t:"warn"},
     {k:"ok",l:"مؤشرات سليمة",t:"good"}].forEach(function(g){
      var list = items.filter(function(i){ return i.type === g.k; });
      if (!list.length) return;
      html += '<div class="advgroup"><h3 class="advhead '+g.t+'">'+g.l+' <span>'+list.length+'</span></h3><div class="advlist">'
        + list.map(function(i){
            return '<article class="advcard '+g.t+'"><header><h4>'+esc(i.title)+'</h4>'
              + '<span class="advtag">'+esc(i.area)+'</span></header><p>'+esc(i.body)+'</p>'
              + (i.evidence ? '<p class="evidence">'+esc(i.evidence)+'</p>' : '') + '</article>';
          }).join("")
        + '</div></div>';
    });
  }

  html += '<div class="panel next"><div class="panel-head"><h3>الخطوات التالية من خطة المزرعة</h3>'
    + '<span class="panel-tag">ما بعد الإطلاق</span></div><ol class="nextlist">'
    + '<li><b>تدريب إدارة</b> — تأهيل الفريق على تشغيل المنظومة المتكاملة ومراقبة مؤشراتها.</li>'
    + '<li><b>تحسين بيئة</b> — تطوير البيوت الزجاجية والحظائر ورفع كفاءة استهلاك المياه والطاقة.</li>'
    + '<li><b>خطة تسويق</b> — إطلاق هوية المزرعة وبناء قنوات بيع مباشرة وشراكات ثابتة.</li>'
    + '</ol><p class="hint">نفّذوا الخطوات الثلاث بشكل متزامن لتحقيق أقصى أثر.</p></div>';
  return html;
}

/* ============================================================
   بيانات تجريبية
   ============================================================ */
function demoRecords(){
  var out = [], w;
  function d(back){ return new Date(Date.now() - back*86400000).toISOString().slice(0,10); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function rnd(n){ return Math.round(Math.random()*n); }
  for (w=0; w<13; w++){
    var b = w*7;
    out.push({id:uid(), kind:"plants", date:d(b+1), zone:pick(ZONES_PLANT),
      item:pick(["شتلات موسمية","شتلات دائمة","نباتات زينة داخلية","نباتات زينة خارجية"]),
      qty:300+rnd(400), cost:900+rnd(600), note:""});
    out.push({id:uid(), kind:"ops", date:d(b+2), opType:"ريّ", zone:pick(ZONES_PLANT), qty:55+rnd(30)+w, cost:120, note:""});
    out.push({id:uid(), kind:"ops", date:d(b+4), opType:pick(["تجهيز","صيانة","حصاد"]), zone:pick(ZONES_PLANT), qty:40+rnd(120), cost:200+rnd(300), note:""});
    out.push({id:uid(), kind:"flock", date:d(b+3), category:"تغذية", head:180, qty:520+rnd(120), cost:1600+rnd(500), note:""});
    if (w % 4 === 0) out.push({id:uid(), kind:"flock", date:d(b+5), category:"تكاثر", head:180, qty:6+rnd(5), cost:150, note:""});
    if (w % 6 === 0) out.push({id:uid(), kind:"flock", date:d(b+6), category:"صحة", head:180, qty:180, cost:900, note:"تطعيم دوري"});
    out.push({id:uid(), kind:"sales", date:d(b+6), product:pick(["شتلات","نباتات زينة"]),
      channel:pick(["مشاتل التجزئة","مشاتل التجزئة","أفراد من المزرعة"]), qty:180+rnd(200), price:12+rnd(10), note:""});
    if (w % 2 === 0) out.push({id:uid(), kind:"sales", date:d(b+5), product:pick(["لحوم","ألبان"]), channel:"السوق المحلي", qty:60+rnd(80), price:28+rnd(14), note:""});
    out.push({id:uid(), kind:"cycle", date:d(b+2), resource:"روث مجمّع", qty:400+rnd(150), note:""});
    out.push({id:uid(), kind:"cycle", date:d(b+5), resource:"سماد عضوي منتج", qty:90+rnd(60), note:""});
    if (w % 3 === 0) out.push({id:uid(), kind:"cycle", date:d(b+6), resource:"مياه معاد تدويرها", qty:20+rnd(15), note:""});
    out.push({id:uid(), kind:"expense", date:d(b+1), category:pick(EXP_CATS), section:pick(SECTIONS), cost:400+rnd(900), note:""});
  }
  return out.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}

/* ============================================================
   النافذة والتفاعل
   ============================================================ */
function openModal(title, note, text, importMode){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalNote").textContent = note;
  var ta = document.getElementById("modalText");
  ta.value = text; ta.readOnly = !importMode;
  document.getElementById("importBtn").hidden = !importMode;
  document.getElementById("modal").hidden = false;
  if (!importMode) ta.select();
}
function closeModal(){ document.getElementById("modal").hidden = true; }

function render(){
  var p = document.getElementById("page");
  if (state.tab === "entry") p.innerHTML = pageEntry();
  else if (state.tab === "reports") p.innerHTML = pageReports();
  else if (state.tab === "analysis") p.innerHTML = pageAnalysis();
  else p.innerHTML = pageAdvice();

  var tabs = document.querySelectorAll(".tab");
  for (var i=0;i<tabs.length;i++)
    tabs[i].classList.toggle("on", tabs[i].getAttribute("data-tab") === state.tab);

  if (state.tab === "entry") refreshDynamic();
  window.scrollTo({ top:0, behavior:"auto" });
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]"); if (!b) return;
  state.tab = b.getAttribute("data-tab"); render();
});

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act");

  if (act === "kind"){ state.kind = b.getAttribute("data-kind"); render(); }
  else if (act === "save") submitForm();
  else if (act === "clear") render();
  else if (act === "del") delRecord(b.getAttribute("data-id"));
  else if (act === "demo"){ state.records = demoRecords(); save(); render(); toast("تمت تعبئة بيانات تجريبية لثلاثة أشهر"); }
  else if (act === "csv") exportCsv();
  else if (act === "export-json"){
    var json = JSON.stringify(state.records, null, 2);
    download("نسخة-مزرعتي.json", json, "application/json");
    openModal("نسخة احتياطية", "احفظ هذا النص في ملف، أو انسخه إلى جهاز آخر واستورده هناك.", json, false);
  }
  else if (act === "import-json") openModal("استيراد نسخة", "الصق محتوى ملف النسخة الاحتياطية هنا ثم اضغط استيراد. سيحل محل البيانات الحالية.", "", true);
  else if (act === "modal-import"){
    try {
      var data = JSON.parse(document.getElementById("modalText").value);
      if (!Array.isArray(data)) throw new Error("bad");
      state.records = data; save(); closeModal(); render(); toast("تم استيراد " + data.length + " سجل");
    } catch(err){ toast("الملف غير صالح — تأكد من نسخ المحتوى كاملاً"); }
  }
  else if (act === "modal-close") closeModal();
  else if (act === "wipe"){
    if (confirm("سيتم حذف جميع سجلات المزرعة نهائياً. هل أنت متأكد؟")){
      state.records = []; save(); render(); toast("تم حذف كل البيانات");
    }
  }
});

document.addEventListener("input", function(e){
  var t = e.target;
  if (t.closest("#form")) refreshDynamic();
  var fkey = t.getAttribute && t.getAttribute("data-filter");
  if (fkey){ state.filters[fkey] = t.value; renderReportsKeepFocus(fkey); }
});
document.addEventListener("change", function(e){
  if (e.target.closest("#form")) refreshDynamic();
});

/* إعادة رسم التقارير مع إبقاء المؤشر في حقل البحث */
var reportTimer = null;
function renderReportsKeepFocus(fkey){
  clearTimeout(reportTimer);
  reportTimer = setTimeout(function(){
    var pos = null, el = document.querySelector('[data-filter="'+fkey+'"]');
    if (el && el.type === "text") pos = el.selectionStart;
    render();
    var el2 = document.querySelector('[data-filter="'+fkey+'"]');
    if (el2){ el2.focus(); if (pos !== null && el2.setSelectionRange) el2.setSelectionRange(pos, pos); }
  }, 180);
}

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeModal();
});

load(function(){ render(); });
</script>
